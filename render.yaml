services:
  - type: web
    name: gesturehub-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: false
      - key: REDIS_HOST
        fromService:
          name: gesturehub-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: gesturehub-redis
          type: redis
          property: port
      - key: FRONTEND_URL
        sync: false  # Set in Render dashboard: https://your-vercel-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false  # Set in Render dashboard: https://your-vercel-app.vercel.app
      - key: GESTURE_CONFIDENCE_THRESHOLD
        value: "0.85"
      - key: GESTURE_SMOOTHING_WINDOW
        value: "3"

  - type: redis
    name: gesturehub-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
